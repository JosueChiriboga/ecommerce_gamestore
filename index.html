<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameStore</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">GameStore</div>
    <div class="nav-links">
      <a href="#">Inicio</a>
      <a href="#" class="active">Tienda</a>
      <a href="#">Colección</a>
      <a href="#">Acerca</a>
      <a href="#">Contacto</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" title="Buscar">&#128269;</button>
      <button class="icon-btn" title="Cuenta">&#128100;</button>
      <button class="icon-btn cart-icon-btn" id="cartBtn" title="Carrito">
        &#128717;
        <span class="badge" id="badge" style="display:none">0</span>
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1 class="hero-title">SHOP COLLECTION</h1>
    <p class="hero-sub">Encuentra el juego perfecto para cada ocasión</p>
  </section>

  <!-- FILTERS -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">ALL</button>
    <button class="filter-btn" data-filter="RPG">RPG</button>
    <button class="filter-btn" data-filter="Acción">Acción</button>
    <button class="filter-btn" data-filter="Estrategia">Estrategia</button>
    <button class="filter-btn" data-filter="Carreras">Carreras</button>
    <button class="filter-btn" data-filter="Roguelike">Roguelike</button>
    <button class="filter-btn" data-filter="Battle Royale">Battle Royale</button>
    <button class="filter-btn" data-filter="Sandbox">Sandbox</button>
  </div>

  <!-- PRODUCTS -->
  <main class="products-wrapper">
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- CART DRAWER -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Tu Carrito</h3>
      <button class="drawer-close" id="cartClose">&#10005;</button>
    </div>
    <div class="drawer-items" id="cartList">
      <p class="empty-msg">No hay productos en el carrito.</p>
    </div>
    <div class="drawer-footer" id="cartTotal" style="display:none">
      <div class="total-row">
        <span>Total</span>
        <strong id="totalPrice">$0.00</strong>
      </div>
      <button class="btn-checkout">Finalizar Compra</button>
      <button class="btn-clear" id="btnClear">Vaciar Carrito</button>
    </div>
  </aside>

  <footer class="footer">
    <p>© 2026 GameStore &mdash; Josue Chiriboga</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
